services:
  - type: web
    name: sentinel-desk-api
    runtime: node
    plan: free
    region: oregon
    # Render's build container has a read-only /usr/bin, so `corepack enable`
    # (which links a global pnpm binary there) fails with EROFS. npx sidesteps
    # that entirely - it caches pnpm under the user's own npm cache dir instead.
    #
    # --prod=false overrides the NODE_ENV=production default of skipping
    # devDependencies - prisma (CLI), @nestjs/cli, and typescript all live
    # there, and the build genuinely needs them (nest build, prisma generate,
    # and the start command's prisma migrate deploy all shell out to them).
    # They're still devDependencies conceptually; this just makes sure the
    # one install this service ever runs includes them.
    buildCommand: >-
      npx pnpm@latest install --frozen-lockfile --prod=false &&
      npx pnpm@latest --filter @sentinel-desk/backend exec prisma generate &&
      npx pnpm@latest --filter @sentinel-desk/backend build
    # `prisma db seed` is idempotent (upserts throughout - see prisma/seed.ts), so
    # it's safe to run on every deploy/restart, not just the first one. This keeps
    # the demo accounts (admin@acme.com etc., password Password123!) present even
    # after a database reset, so the login page's one-click demo buttons always work.
    startCommand: >-
      npx pnpm@latest --filter @sentinel-desk/backend exec prisma migrate deploy &&
      npx pnpm@latest --filter @sentinel-desk/backend exec prisma db seed &&
      node apps/backend/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: SentinelDesk
      - key: BACKEND_PORT
        value: 4000
      # Set these in the Render dashboard (Environment tab) rather than here —
      # they're secrets/per-provider values, not something to commit to git.
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_PORT
        sync: false
      - key: STORAGE_USE_SSL
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: THROTTLE_TTL
        value: 60
      - key: THROTTLE_LIMIT
        value: 100
